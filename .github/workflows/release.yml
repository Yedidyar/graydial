name: Release

# Push a tag like v0.1.0 (matching versionName in app/build.gradle.kts) to build,
# sign and publish an APK on the GitHub Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAYDIAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing GRAYDIAL_KEYSTORE_BASE64 secret" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build signed release
        env:
          GRAYDIAL_STORE_FILE: ${{ runner.temp }}/release.jks
          GRAYDIAL_STORE_PASSWORD: ${{ secrets.GRAYDIAL_STORE_PASSWORD }}
          GRAYDIAL_KEY_ALIAS: ${{ secrets.GRAYDIAL_KEY_ALIAS }}
          GRAYDIAL_KEY_PASSWORD: ${{ secrets.GRAYDIAL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Verify signature and package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          ! "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions "$apk" | grep -q "android.permission.INTERNET"
          out="graydial-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "graydial-${GITHUB_REF_NAME}.apk" "graydial-${GITHUB_REF_NAME}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GrayDial ${GITHUB_REF_NAME}" \
            --generate-notes
